<button
  id="guide-open"
  class="guide-launcher"
  type="button"
  aria-controls="guide-panel"
  aria-expanded="false"
>
  <span class="guide-spark">✦</span>
  Ask Money Guide
  <span aria-hidden="true">↗</span>
</button>

<div id="guide-backdrop" class="guide-backdrop" hidden></div>

<section
  id="guide-panel"
  class="guide-panel"
  role="dialog"
  aria-modal="true"
  aria-labelledby="guide-title"
  hidden
>
  <div class="guide-header">
    <div class="guide-header-top">
      <span>✦ &nbsp; TRANSACTION MONITOR / ASSISTANT</span>
      <button id="guide-close" type="button" aria-label="Close assistant">×</button>
    </div>

    <h2 id="guide-title">Money Guide<span>.</span></h2>
    <p>Banking concepts, explained simply.</p>
    <span id="guide-mode" class="guide-mode">Demo guide</span>
  </div>

  <div
    id="guide-messages"
    class="guide-messages"
    role="log"
    aria-label="Assistant conversation"
    aria-live="polite"
  ></div>

  <div class="guide-bottom">
    <div class="guide-prompts">
      <button type="button" data-guide-question="Why was a transaction flagged?">
        Why was it flagged?
      </button>
      <button type="button" data-guide-question="What is a transaction threshold?">
        What is a threshold?
      </button>
      <button type="button" data-guide-question="How does this demo work?">
        How does this work?
      </button>
    </div>

    <form id="guide-form">
      <label class="guide-hidden" for="guide-input">Ask Money Guide</label>
      <textarea
        id="guide-input"
        rows="1"
        maxlength="500"
        placeholder="Ask a banking question..."
        required
      ></textarea>
      <button id="guide-send" type="submit" aria-label="Send message">↑</button>
    </form>

    <p class="guide-note">
      Educational demo. No account access or live rates. Do not enter real
      account, card, or personal information.
    </p>
  </div>
</section>
